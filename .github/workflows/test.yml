name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # jsdom 30 (ImportHistory component tests) needs Node 22+;
          # Node 20 fails worker startup with undici webidl errors.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:run

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke E2E
        run: npx playwright test e2e/smoke.spec.ts
        env:
          # Enough for Next to boot public/auth pages; no Mongo required for smoke.
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3000
